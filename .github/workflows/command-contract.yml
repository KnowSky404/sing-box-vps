name: Command contract

# Run only after the user explicitly authorizes this workflow, ref and scope.
on:
  workflow_dispatch:
    inputs:
      head_sha:
        description: Authorized full candidate commit SHA
        required: true
        type: string
      base_ref:
        description: Authorized full comparison base commit SHA
        required: true
        type: string
      legacy_core:
        description: Include sing-box 1.13.18 for selected compatibility checks
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  authorize-head:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Validate inputs in the protected main workflow
        env:
          EXPECTED_HEAD: ${{ inputs.head_sha }}
          EXPECTED_BASE: ${{ inputs.base_ref }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main || ! "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ || ! "$EXPECTED_BASE" =~ ^[0-9a-f]{40}$ ]]; then
            printf 'Dispatch from protected main with the authorized full head and base SHAs.\n' >&2
            exit 2
          fi
  command-contract:
    needs: authorize-head
    concurrency:
      group: command-contract-${{ github.sha }}-${{ inputs.head_sha }}-${{ inputs.base_ref }}-${{ inputs.legacy_core }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.head_sha }}
          path: candidate
          persist-credentials: false
      - name: Prepare verified target core for host configuration tests
        working-directory: candidate
        env:
          EXPECTED_HEAD: ${{ inputs.head_sha }}
          EXPECTED_BASE: ${{ inputs.base_ref }}
          LEGACY_CORE: ${{ inputs.legacy_core }}
          TRUSTED_MAIN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse --verify HEAD)" == "$EXPECTED_HEAD" ]]
          [[ "$(git rev-parse --verify --end-of-options "${EXPECTED_BASE}^{commit}")" == "$EXPECTED_BASE" ]]
          if ! git merge-base --is-ancestor "$EXPECTED_BASE" "$TRUSTED_MAIN_SHA"; then
            printf 'The comparison base must be in protected main history.\n' >&2
            exit 2
          fi
          if git merge-base --is-ancestor "$EXPECTED_HEAD" "$TRUSTED_MAIN_SHA"; then
            ACTUAL_BASE=$(git merge-base "$EXPECTED_BASE" "$EXPECTED_HEAD")
          else
            ACTUAL_BASE=$(git merge-base "$TRUSTED_MAIN_SHA" "$EXPECTED_HEAD")
          fi
          if [[ "$ACTUAL_BASE" != "$EXPECTED_BASE" ]]; then
            printf 'The authorized base differs from the candidate merge base %s.\n' "$ACTUAL_BASE" >&2
            exit 2
          fi
          CORE_VERSION=$(sed -n 's/^readonly SB_SUPPORT_MAX_VERSION="\([^"]*\)"$/\1/p' install.sh)
          case "$(uname -m)" in x86_64) CORE_ARCH=amd64 ;; aarch64) CORE_ARCH=arm64 ;; *) exit 1 ;; esac
          prepare_core() {
            local version=$1 variable=$2 asset stage digest binary
            asset="sing-box-${version}-linux-${CORE_ARCH}.tar.gz"
            stage=$(mktemp -d "${RUNNER_TEMP}/sing-box.XXXXXXXX")
            curl -fsSL --connect-timeout 15 --max-time 120 --retry 2 \
              "https://api.github.com/repos/SagerNet/sing-box/releases/tags/v${version}" > "${stage}/release.json"
            digest=$(jq -er --arg name "$asset" '.assets[] | select(.name == $name) | .digest' "${stage}/release.json")
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            curl -fsSL --connect-timeout 15 --max-time 180 --retry 2 \
              "https://github.com/SagerNet/sing-box/releases/download/v${version}/${asset}" -o "${stage}/${asset}"
            printf '%s  %s\n' "${digest#sha256:}" "${stage}/${asset}" | sha256sum -c -
            tar --no-same-owner -xzf "${stage}/${asset}" -C "${stage}"
            binary="${stage}/sing-box-${version}-linux-${CORE_ARCH}/sing-box"
            [[ "$("$binary" version | sed -n '1p')" == "sing-box version ${version}" ]]
            printf '%s=%s\n' "$variable" "$binary" >> "$GITHUB_ENV"
          }
          prepare_core "$CORE_VERSION" SINGBOX_BINARY_114
          if [[ "$LEGACY_CORE" == true ]]; then
            prepare_core 1.13.18 SINGBOX_BINARY_113
          fi
      - name: Run contract and scoped host regressions
        working-directory: candidate
        env:
          VERIFY_BASE_REF: ${{ inputs.base_ref }}
          TRUSTED_MAIN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          CI_RUN_LOG="${RUNNER_TEMP}/scoped-host-verification.log"
          CI_STATUS=0
          # Root-owned storage fixtures reject runner-owned ancestors.
          sudo -n env TMPDIR=/tmp GIT_CONFIG_COUNT=2 GIT_CONFIG_KEY_0=safe.directory \
            GIT_CONFIG_VALUE_0="$PWD" SINGBOX_BINARY_114="$SINGBOX_BINARY_114" \
            GIT_CONFIG_KEY_1=safe.directory GIT_CONFIG_VALUE_1="$GITHUB_WORKSPACE/trusted" \
            SINGBOX_BINARY_113="${SINGBOX_BINARY_113:-}" \
            bash "$GITHUB_WORKSPACE/trusted/dev/verification/ci.sh" "$VERIFY_BASE_REF" "$PWD" "$TRUSTED_MAIN_SHA" 2>&1 | tee "$CI_RUN_LOG" || CI_STATUS=$?
          # The parent emits its directory before any nested test diagnostics.
          CI_HOST_RUN_DIR=$(sed -n '/^run_dir=/{s/^run_dir=//;p;q;}' "$CI_RUN_LOG")
          if [[ -n "$CI_HOST_RUN_DIR" ]]; then
            [[ "$CI_HOST_RUN_DIR" == "$PWD"/dev/verification-runs/* && "$CI_HOST_RUN_DIR" != *$'\n'* ]]
            [[ -d "$CI_HOST_RUN_DIR" && ! -L "$CI_HOST_RUN_DIR" ]]
            printf 'CI_HOST_RUN_DIR=%s\n' "$CI_HOST_RUN_DIR" >> "$GITHUB_ENV"
            [[ -f "$CI_HOST_RUN_DIR/plan.txt" && -f "$CI_HOST_RUN_DIR/summary.log" ]]
            cat "$CI_HOST_RUN_DIR/summary.log" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "$CI_STATUS" == 0 ]]; then
            [[ -n "$CI_HOST_RUN_DIR" ]]
            grep -Fxq 'host_gate=passed' "$CI_HOST_RUN_DIR/summary.log"
          fi
          exit "$CI_STATUS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: scoped-host-verification
          path: |
            candidate/dev/verification-runs/ci/
            ${{ env.CI_HOST_RUN_DIR }}
            ${{ runner.temp }}/scoped-host-verification.log
          retention-days: 14
          if-no-files-found: ignore
