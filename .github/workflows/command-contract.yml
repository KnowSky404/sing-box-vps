name: Command contract

# Run only after the user explicitly authorizes this workflow, ref and scope.
on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Comparison base (Git ref or commit SHA)
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  command-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Prepare verified target core for host configuration tests
        run: |
          set -euo pipefail
          CORE_VERSION=$(sed -n 's/^readonly SB_SUPPORT_MAX_VERSION="\([^"]*\)"$/\1/p' install.sh)
          case "$(uname -m)" in x86_64) CORE_ARCH=amd64 ;; aarch64) CORE_ARCH=arm64 ;; *) exit 1 ;; esac
          CORE_ASSET="sing-box-${CORE_VERSION}-linux-${CORE_ARCH}.tar.gz"
          CORE_STAGE_DIR=$(mktemp -d "${RUNNER_TEMP}/sing-box.XXXXXXXX")
          curl -fsSL --connect-timeout 15 --max-time 120 --retry 2 \
            "https://api.github.com/repos/SagerNet/sing-box/releases/tags/v${CORE_VERSION}" > "${CORE_STAGE_DIR}/release.json"
          CORE_DIGEST=$(jq -er --arg name "$CORE_ASSET" '.assets[] | select(.name == $name) | .digest' "${CORE_STAGE_DIR}/release.json")
          [[ "$CORE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          curl -fsSL --connect-timeout 15 --max-time 180 --retry 2 \
            "https://github.com/SagerNet/sing-box/releases/download/v${CORE_VERSION}/${CORE_ASSET}" -o "${CORE_STAGE_DIR}/${CORE_ASSET}"
          printf '%s  %s\n' "${CORE_DIGEST#sha256:}" "${CORE_STAGE_DIR}/${CORE_ASSET}" | sha256sum -c -
          tar --no-same-owner -xzf "${CORE_STAGE_DIR}/${CORE_ASSET}" -C "${CORE_STAGE_DIR}"
          VALIDATION_CORE="${CORE_STAGE_DIR}/sing-box-${CORE_VERSION}-linux-${CORE_ARCH}/sing-box"
          [[ "$("$VALIDATION_CORE" version | sed -n '1p')" == "sing-box version ${CORE_VERSION}" ]]
          printf 'SINGBOX_BINARY_114=%s\n' "$VALIDATION_CORE" >> "$GITHUB_ENV"
      - name: Run contract and scoped host regressions
        env:
          VERIFY_BASE_REF: ${{ inputs.base_ref }}
        run: |
          set -euo pipefail
          CI_RUN_LOG="${RUNNER_TEMP}/scoped-host-verification.log"
          CI_STATUS=0
          sudo -n env TMPDIR=/tmp GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory \
            GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE" GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" \
            GITHUB_REF="$GITHUB_REF" SINGBOX_BINARY_114="$SINGBOX_BINARY_114" \
            bash dev/verification/ci.sh "$VERIFY_BASE_REF" | tee "$CI_RUN_LOG" || CI_STATUS=$?
          CI_HOST_RUN_DIR=$(sed -n 's/^run_dir=//p' "$CI_RUN_LOG")
          if [[ -n "$CI_HOST_RUN_DIR" ]]; then
            [[ "$CI_HOST_RUN_DIR" == "$GITHUB_WORKSPACE"/dev/verification-runs/* && "$CI_HOST_RUN_DIR" != *$'\n'* ]]
            [[ -f "$CI_HOST_RUN_DIR/plan.txt" && -f "$CI_HOST_RUN_DIR/summary.log" ]]
            printf 'CI_HOST_RUN_DIR=%s\n' "$CI_HOST_RUN_DIR" >> "$GITHUB_ENV"
          fi
          exit "$CI_STATUS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scoped-host-verification
          path: |
            dev/verification-runs/ci/
            ${{ env.CI_HOST_RUN_DIR }}
          if-no-files-found: ignore
