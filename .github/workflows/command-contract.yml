name: Command contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  command-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Run contract and scoped host regressions
        env:
          VERIFY_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          sudo -n env TMPDIR=/tmp GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory \
            GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE" GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" \
            GITHUB_REF="$GITHUB_REF" bash dev/verification/ci.sh "$VERIFY_BASE_REF"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scoped-host-verification
          path: dev/verification-runs/
          if-no-files-found: ignore
