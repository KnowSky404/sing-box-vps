interface:
  display_name: "sing-box-vps Operator"
  short_description: "Maintain, verify, and operate sing-box-vps hosts"
  default_prompt: "Use $sing-box-vps-operator to prepare a safe install, capability discovery, 1.13-to-1.14 upgrade preflight or guarded upgrade, verification, troubleshooting, REALITY instance, client export, or SubMan workflow for sing-box-vps. Discover operations with sbv commands --json and sbv schema <operation-id> --json; classify read-only, mutating, sensitive, and interactive-only actions before execution. Keep changed commands, operation descriptors and Agent manuals synchronized."

policy:
  allow_implicit_invocation: true
